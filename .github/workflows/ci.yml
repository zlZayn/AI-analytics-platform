name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    name: Lint · Typecheck · Test · Build · Docs
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node (version from .node-version)
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      # --ignore-scripts：与本地 npm 12 默认拦截依赖安装脚本的行为一致（已验证构建/测试/运行都成立），
      # 也让安装步骤不执行第三方生命周期脚本；新增依赖若确实需要 postinstall，会在这里响亮失败而不是静默出错。
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          ENCRYPTION_KEY: "ci-only-build-placeholder-key-not-used-at-runtime"
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"

      - name: Check docs links
        run: python scripts/check-links.py . --fragments --refs

      - name: Check git diff cleanliness
        run: git diff --check

  # 浏览器面回归守卫：offline E2E 全程 mock API（页面路由）、主动 abort WebR CDN，
  # 因此不需要数据库、密钥或外网；覆盖 Monaco、结果区、R 面板、统一历史时间线、分割句柄、移动端。
  e2e:
    name: Offline E2E (browser)
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 25
    env:
      ENCRYPTION_KEY: "ci-only-build-placeholder-key-not-used-at-runtime"
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node (version from .node-version)
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('scripts/requirements.txt') }}

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r scripts/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Run offline E2E against the production build
        run: |
          mkdir -p .artifacts
          npx next start -p 4321 > .artifacts/next-start.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl -sf http://localhost:4321 > /dev/null && break
            sleep 2
          done
          if ! curl -sf http://localhost:4321 > /dev/null; then
            echo "next start did not become ready"
            cat .artifacts/next-start.log
            exit 1
          fi
          python scripts/offline_workspace_e2e.py

      - name: Upload E2E artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: offline-e2e-artifacts
          path: |
            .artifacts/offline-e2e
            .artifacts/next-start.log
          if-no-files-found: ignore
