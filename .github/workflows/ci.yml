name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    name: Lint · Typecheck · Test · Build · Docs
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          ENCRYPTION_KEY: "ci-only-build-placeholder-key-not-used-at-runtime"
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"

      - name: Check docs links
        run: python scripts/check-links.py .

      - name: Check git diff cleanliness
        run: git diff --check