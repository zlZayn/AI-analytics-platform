# 依赖更新策略：每周分组提 PR（生产/开发各一组，只含 minor+patch），CI 全绿才合并。
# 框架与工具链的 major 一律手动评估（Next/React/Prisma/Tailwind/TypeScript/ESLint）。
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    groups:
      production-minor-patch:
        dependency-type: production
        update-types: ["minor", "patch"]
        # monaco-editor 0.56 改了 ESM 路径（src/lib/monaco-setup.ts 直接 import esm/vs/basic-languages/r/…），
        # 混进分组会让整组 typecheck 失败；拆出去单独出 PR、单独评估。
        exclude-patterns:
          - monaco-editor
      development-minor-patch:
        dependency-type: development
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: next
        update-types: ["version-update:semver-major"]
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]
      - dependency-name: prisma
        update-types: ["version-update:semver-major"]
      - dependency-name: "@prisma/client"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@prisma/adapter-pg"
        update-types: ["version-update:semver-major"]
      - dependency-name: tailwindcss
        update-types: ["version-update:semver-major"]
      - dependency-name: "@tailwindcss/postcss"
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      # 类型定义必须跟随 Node 基线（.node-version），不能自动跨主版本
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # 大版本 SDK / 测试框架需人工评估（对应 PR 已关闭，不再自动提）
      - dependency-name: openai
        update-types: ["version-update:semver-major"]
      - dependency-name: vitest
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
